name: Cache cargo fingerprints and build-script outputs
description: >
  Persist target/<profile>/{.fingerprint,build} across runs, layered on top of
  Swatinem/rust-cache. rust-cache keeps dependency rlibs under target/*/deps but
  drops the matching .fingerprint files and native/codegen build-script outputs.
  Without the fingerprint cargo cannot verify a cached rlib and recompiles it
  from scratch, so every warm run rebuilt the gemm-*/pulp/faer SIMD-codegen
  stack and openblas-src's 6.5-min C library despite a full cache hit. These two
  dirs are tiny next to deps/, so restoring them reunites cargo with the rlibs
  rust-cache already cached. cargo's fingerprint check gates reuse but does not
  see the host CPU, and openblas-src builds its C library for the build host's
  instruction set, so the key also carries a hash of the runner's CPU flags:
  an entry built on an AVX-512 runner must not be restored on one without it
  (SIGILL in krylov_vector, main 01355ba4).
inputs:
  key:
    description: Per-job key discriminator; must be unique per build profile.
    required: true
runs:
  using: composite
  steps:
    - id: cpu
      shell: bash
      run: |
        if [ -r /proc/cpuinfo ]; then
          flags=$(grep -m1 '^flags' /proc/cpuinfo)
        else
          flags=$(sysctl -n machdep.cpu.features machdep.cpu.leaf7_features hw.optional 2>/dev/null || uname -m)
        fi
        echo "hash=$(printf '%s' "$flags" | shasum -a 256 | cut -c1-12)" >> "$GITHUB_OUTPUT"
    # Why-not fold into rust-cache's key: rust-cache owns the lockfile hash and
    # its own pruning; a separate cache with a coarser (Cargo.toml) key lets
    # these dirs survive rust-cache's prune without fighting its restore. The
    # llvm-cov-target paths cover the coverage job, which builds one level deeper.
    # Why-not save from PR refs: a PR-scoped cache is usable only by that PR's
    # merge ref, and those caches pushed the repository past its Actions cache
    # limit (#1742). Main saves; every other ref only restores main's entry.
    - if: github.ref == 'refs/heads/main'
      uses: actions/cache@v4
      with:
        path: |
          symtn/target/*/.fingerprint
          symtn/target/*/build
          symtn/target/llvm-cov-target/*/.fingerprint
          symtn/target/llvm-cov-target/*/build
        key: cargo-fp-v3-${{ inputs.key }}-${{ runner.os }}-${{ steps.cpu.outputs.hash }}-${{ hashFiles('symtn/**/Cargo.toml') }}
        restore-keys: |
          cargo-fp-v3-${{ inputs.key }}-${{ runner.os }}-${{ steps.cpu.outputs.hash }}-
    - if: github.ref != 'refs/heads/main'
      uses: actions/cache/restore@v4
      with:
        path: |
          symtn/target/*/.fingerprint
          symtn/target/*/build
          symtn/target/llvm-cov-target/*/.fingerprint
          symtn/target/llvm-cov-target/*/build
        key: cargo-fp-v3-${{ inputs.key }}-${{ runner.os }}-${{ steps.cpu.outputs.hash }}-${{ hashFiles('symtn/**/Cargo.toml') }}
        restore-keys: |
          cargo-fp-v3-${{ inputs.key }}-${{ runner.os }}-${{ steps.cpu.outputs.hash }}-
