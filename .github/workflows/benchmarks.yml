name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  criterion:
    name: Criterion benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: symtn
      - name: Record source revisions
        run: |
          git -C symtn log -1 --format='symtn %H'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: symtn
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: benchmarks
      # Why not PR CI: hosted-runner timing noise makes these diagnostic
      # measurements unsuitable as correctness gates.
      - name: FusionTreeKey hash/eq microbench
        run: cargo bench --locked -p symtn-core --bench fusion_tree_key
        working-directory: symtn
      - name: strided-combine microbench
        run: cargo bench --locked -p symtn-operations --bench strided_combine
        working-directory: symtn
      - name: permute U(1) many-charge microbench
        run: cargo bench --locked -p symtn-operations --bench permute_u1_many
        working-directory: symtn

  # Measurements that reach private phases or a counting global allocator
  # run here in release: the Host contract-batch timing bench, and
  # measurement-only tests that live beside the suites they measure, tagged
  # `#[ignore = "benchmark: run via benchmarks.yml"]` and run one thread so
  # their samples do not contend. Why not PR CI: they print numbers and
  # assert no contract.
  ignored-measurements:
    name: Ignored measurement tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: symtn
      - name: Record source revisions
        run: |
          git -C symtn log -1 --format='symtn %H'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: symtn
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: benchmarks-ignored-measurements
      - name: typed contract batch measurements
        if: ${{ !cancelled() }}
        run: cargo bench --locked --profile release -p symtn --bench contract_batch_timing
        working-directory: symtn
      - name: transform-replay member batch measurement
        if: ${{ !cancelled() }}
        run: cargo test --locked --release -p symtn-operations --lib -- --ignored --exact transform_replay::member::tests::member_batch_measurement --nocapture
        working-directory: symtn
      - name: checked-Generic public transform measurement (cgc-gen)
        if: ${{ !cancelled() }}
        run: cargo test --locked --release -p symtn --no-default-features --features cgc-gen,cpu-faer --test serial -- --ignored --exact permute_overwrite_allocations::checked_generic_public_transform_measurement --nocapture
        working-directory: symtn
      - name: checked-Generic transform phase measurement (cgc-gen)
        if: ${{ !cancelled() }}
        run: cargo test --locked --release -p symtn-tensors --no-default-features --features cgc-gen,cpu-faer --lib -- --ignored --exact tests::tree_transform_plan::generic::measure_checked_generic_transform_phases --nocapture
        working-directory: symtn
