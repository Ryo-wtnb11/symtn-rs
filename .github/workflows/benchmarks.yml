name: Benchmarks

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  criterion:
    name: Criterion benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: symtn
      - name: Record source revisions
        run: |
          git -C symtn log -1 --format='symtn %H'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: symtn
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: benchmarks
      # Why not PR CI: hosted-runner timing noise makes these diagnostic
      # measurements unsuitable as correctness gates.
      - name: FusionTreeKey hash/eq microbench
        run: cargo bench --locked -p symtn-core --bench fusion_tree_key
        working-directory: symtn
      - name: strided-combine microbench
        run: cargo bench --locked -p symtn-operations --bench strided_combine
        working-directory: symtn
      - name: permute U(1) many-charge microbench
        run: cargo bench --locked -p symtn-operations --bench permute_u1_many
        working-directory: symtn

  # Why not PR CI: these benches print numbers and assert no contract.
  # They install the counting global allocator, so they run in release,
  # one at a time.
  allocation-counting-benches:
    name: Allocation-counting benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: symtn
      - name: Record source revisions
        run: |
          git -C symtn log -1 --format='symtn %H'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: symtn
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: benchmarks-allocation-counting
      - name: typed contract batch measurements
        if: ${{ !cancelled() }}
        run: cargo bench --locked --profile release -p symtn --bench contract_batch_timing
        working-directory: symtn
      - name: checked-Generic public transform (cgc-gen)
        if: ${{ !cancelled() }}
        run: cargo bench --locked -p symtn --no-default-features --features cgc-gen,cpu-faer --bench checked_generic_transform
        working-directory: symtn
