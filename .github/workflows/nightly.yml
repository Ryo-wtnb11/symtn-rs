name: macOS nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '17 15 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Why-not every main push: this full default-provider suite dominates runner
  # minutes. Nightly and manual main runs preserve its macOS runtime contracts;
  # the scoped Accelerate backend checks remain in push/PR CI.
  test-macos:
    name: cargo test (macos-latest)
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          path: symtn
      - name: Record source revisions
        run: |
          git -C symtn log -1 --format='symtn %H'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: symtn
          save-if: ${{ github.ref == 'refs/heads/main' }}
          key: workspace-test-debug0-v1
      - uses: ./symtn/.github/actions/cargo-build-script-cache
        with:
          key: test-macos
      # Why-not serialize integration binaries: their global-state tests are
      # single-test processes or take their own locks. `--test '*'` selects
      # integration targets only, so the lib runs once and stays serialized.
      - name: Run symtn-tensors tests with isolated cache snapshots
        run: |
          cargo test --locked -p symtn-tensors --lib -- --test-threads=1
          cargo test --locked -p symtn-tensors --test '*'
        working-directory: symtn
      - name: Run remaining workspace tests
        run: cargo test --locked --workspace --exclude symtn-tensors --tests
        working-directory: symtn
      - name: Run workspace doctests
        run: cargo test --locked --workspace --doc
        working-directory: symtn
