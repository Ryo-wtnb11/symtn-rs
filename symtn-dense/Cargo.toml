[package]
autotests = false
name = "symtn-dense"
version = "0.1.1"
description = "Dense block execution for symtn"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "symtn_dense"
path = "src/lib.rs"

[features]
default = ["cpu-faer"]
tenferro = [
    "dep:cpueinsum",
    "dep:tcontract",
    "dep:tcontract-exec",
    "dep:tenferro-cpu",
    "dep:tenferro-linalg",
]
cpu-faer = [
    "tenferro",
    "dep:tlinalg",
    "tenferro-cpu/native",
    "tenferro-linalg/native",
]
cpu-blas-core = [
    "tenferro",
    "dep:tlinalg",
    "dep:cpueinsum-blas",
    "tenferro-cpu/blas",
    "tenferro-linalg/blas",
]
cpu-blas = [
    "cpu-blas-core",
]
blas-accelerate = [
    "cpu-blas-core",
    "tenferro-cpu/blas-accelerate",
    "tenferro-linalg/blas-accelerate",
]
blas-openblas = [
    "cpu-blas-core",
    "tenferro-cpu/blas-openblas",
    "tenferro-linalg/blas-openblas",
]
blas-mkl = [
    "cpu-blas-core",
    "tenferro-cpu/blas-mkl",
    "tenferro-linalg/blas-mkl",
]
cuda = [
    "tenferro",
    "dep:tenferro-gpu",
    "tenferro-gpu/cuda",
    "tenferro-linalg/cuda",
]
provider-inject = [
    "cpu-blas-core",
    "tenferro-cpu/provider-inject",
    "tenferro-linalg/provider-inject",
]

[dependencies]
num-complex = "0.4"
# symtn's block-contraction kernel (#2337); the version tenferro-cpu resolves,
# so `Exec` from `CpuEngine::exec` is this crate's type.
cpueinsum = { version = "0.9.0", optional = true }
# The BLAS provider's grouped GEMM plan, the BLAS counterpart of
# `cpueinsum::GroupedPlan` (same executor vocabulary and version line).
cpueinsum-blas = { version = "0.9.0", optional = true }
# The native block kernel's GEMM plans and factorizations (#2337, #2430).
# Pinned to the versions tenferro-cpu 0.8.0 / tenferro-linalg 0.8.0 resolve,
# so `Exec`, `Plan` and the batch vocabulary are the engine's own types;
# tlinalg follows tenferro-linalg, which links it only with a CPU provider.
tcontract = { version = "=0.9.0", optional = true }
tcontract-exec = { version = "=0.9.0", optional = true }
tlinalg = { version = "=0.8.0", optional = true }
tenferro-cpu = { version = "0.8.0", default-features = false, optional = true }
tenferro-linalg = { version = "0.8.0", default-features = false, optional = true }
# The `Engine` trait every numerical entry takes: needed by backend-free and
# custom-executor builds too, so it is not tied to a CPU provider feature.
tenferro-tensor = { version = "0.8.0", default-features = false }
tenferro-gpu = { version = "0.8.0", default-features = false, optional = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "serial"
path = "tests/serial.rs"
