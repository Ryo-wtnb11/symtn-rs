[package]
autotests = false
name = "symtn-dense"
version = "0.1.1"
description = "Dense block execution for symtn"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "symtn_dense"
path = "src/lib.rs"

[features]
default = ["cpu-faer"]
tenferro = [
    "dep:tcontract",
    "dep:tcontract-exec",
    "dep:tenferro-cpu",
    "dep:tenferro-linalg",
    "dep:tenferro-runtime",
]
cpu-faer = [
    "tenferro",
    "dep:tlinalg",
    "dep:strided-view",
]
cuda = [
    "tenferro",
    "dep:tenferro-gpu",
    "tenferro-gpu/cuda",
    "tenferro-linalg/cuda",
]

[dependencies]
num-complex = "0.4"
# The structure-cache wrapper and registry (budget, stats, reset,
# single-flight) behind the block GEMM kernel's geometry-plan cache.
symtn-core = { version = "0.1.1", path = "../symtn-core" }
# The native block kernel's GEMM plans and factorizations (#2337, #2430).
# Pinned to the versions tenferro-cpu 0.13.0 / tenferro-linalg 0.13.0 resolve,
# so `Exec`, `Plan` and the batch vocabulary are the engine's own types;
# tlinalg is the version tenferro-linalg links.
tcontract = { version = "=0.13.0", optional = true }
tcontract-exec = { version = "=0.13.0", optional = true }
tlinalg = { version = "=0.12.0", optional = true }
# The operand descriptor tlinalg's entries take (`RawStridedRef`); the version
# tlinalg resolves, so it is tlinalg's own type.
strided-view = { version = "=0.8.1", optional = true }
tenferro-cpu = { version = "0.13.0", optional = true }
tenferro-linalg = { version = "0.13.0", default-features = false, optional = true }
# The CPU engine's extension store (`ExecutionEngine::take_extension_caches`),
# which keeps eager Host contraction scratch between calls; the version
# tenferro-cpu 0.13.0 resolves.
tenferro-runtime = { version = "=0.13.0", optional = true }
# The `Engine` trait every numerical entry takes: needed by backend-free and
# custom-executor builds too, so it is not tied to a CPU provider feature.
tenferro-tensor = { version = "0.13.0", default-features = false }
tenferro-gpu = { version = "0.13.0", default-features = false, optional = true }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "serial"
path = "tests/serial.rs"

# Its own binary: the warm allocation count is taken on every thread.
[[test]]
name = "warm_lane_allocations"
path = "tests/warm_lane_allocations.rs"
