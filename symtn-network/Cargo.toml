[package]
autotests = false
name = "symtn-network"
version = "0.1.1"
description = "Tensor-network contraction planning and execution for symtn"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "symtn_network"
path = "src/lib.rs"

[features]
default = ["cpu-faer"]
cpu-faer = ["symtn/cpu-faer"]
cgc-gen = ["symtn/cgc-gen"]
cuda = ["symtn/cuda"]
# `OmecoOptimizer`: omeco's exact search and TreeSA as a
# `DenseContractionOptimizer` backend.
omeco = ["dep:omeco"]

[dependencies]
symtn = { package = "symtn", version = "0.1.1", path = "../symtn", default-features = false }
omeco = { version = "0.2.6", optional = true }
symtn-macros = { version = "0.1.1", path = "../symtn-macros" }
# O(1) LRU (HashMap + intrusive linked list), the Rust analog of the
# `LRUCache.jl` that TensorKit uses for its global caches. Replaces the
# linear-scan `VecDeque` LRU whose touch was O(capacity) per plan-cache hit.
lru = "0.12"

[dev-dependencies]
# Native test providers implement the provider seal through `testing`.
symtn-core = { version = "0.1.1", path = "../symtn-core", features = ["testing"] }

[[bench]]
name = "cuda_operation_matrix"
harness = false
required-features = ["cuda"]

[[bench]]
name = "microbench_cpu_shape_reuse"
harness = false

[[bench]]
name = "cache_scaling"
harness = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "serial"
path = "tests/serial.rs"

[[test]]
name = "intermediate_allocations"
path = "tests/intermediate_allocations.rs"
