[package]
autotests = false
name = "symtn-operations"
version = "0.1.1"
description = "Symmetry-free tensor operations for symtn"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
symtn-core = { version = "0.1.1", path = "../symtn-core" }
symtn-dense = { version = "0.1.1", path = "../symtn-dense", default-features = false }
num-complex = "0.4"
num-traits = "0.2"
smallvec = { version = "1", features = ["const_generics", "union"] }
strided-kernel.workspace = true
rustc-hash = "2"
# Recovers the caller's `CpuEngine` behind `&mut dyn Engine` for Host
# regions (`host_pool::region`); the version symtn-dense uses.
tenferro-cpu = { version = "0.8.0", default-features = false, optional = true }

[features]
# A compiled CPU provider: Host regions take the caller CPU engine's token.
tenferro = ["dep:tenferro-cpu", "symtn-dense/tenferro"]
default = ["cpu-faer"]
cpu-faer = ["tenferro", "symtn-dense/cpu-faer"]
cpu-blas = ["tenferro", "symtn-dense/cpu-blas"]
blas-accelerate = ["tenferro", "symtn-dense/blas-accelerate"]
blas-openblas = ["tenferro", "symtn-dense/blas-openblas"]
blas-mkl = ["tenferro", "symtn-dense/blas-mkl"]
provider-inject = ["tenferro", "symtn-dense/provider-inject"]
# Unstable, internal: reference oracle for tree-transform replay (per-block
# strided driver and scalar recoupling); production replay never uses it.
# It also adds `HostKernelAdapter::recoupling_src_times_u_transpose`,
# a required trait method, so only in-workspace tests/benches may enable it.
testing = []
cuda = ["symtn-dense/cuda"]

[dev-dependencies]
symtn-operations = { path = ".", default-features = false, features = ["testing"] }
# Microbench for the non-contiguous strided-combine regime. Informational,
# not a pass/fail gate (shared CI runners are too noisy); the real gate is the
# size_of canary in host_scalar_kernels.rs. Only pulled in for `cargo bench`.
criterion = { version = "0.5", default-features = false }

[[bench]]
name = "strided_combine"
harness = false

[[bench]]
name = "permute_u1_many"
harness = false

[[bench]]
name = "tree_transform_lowering"
harness = false


[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "serial"
path = "tests/serial.rs"
