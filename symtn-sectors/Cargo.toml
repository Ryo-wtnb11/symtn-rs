[package]
autotests = false
name = "symtn-sectors"
version = "0.1.1"
description = "Fusion-rule providers and sector types for symtn"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "symtn_sectors"
path = "src/lib.rs"

[features]
default = []
cgc-gen = ["fusion-symbols/lie-generated", "dep:num-traits"]
# Test-only provider tier for this and sibling crates: the infallible Generic
# symbol traits (`GenericFusionSymbols`, `GenericRigidSymbols`; production
# Generic is checked only, #1854) and `testing::Provider`, the provider seal
# that native test fixtures implement.
testing = []

[dependencies]
smallvec = { version = "1", features = ["const_generics", "union"] }
num-complex = "0.4"
num-traits = { version = "0.2", optional = true }
fusion-symbols = { version = "0.9.0", default-features = false }

[dev-dependencies]
# Enables `testing` for this crate's own integration tests.
symtn-sectors = { path = ".", features = ["testing"] }

[[test]]
name = "integration"
path = "tests/integration.rs"

[[test]]
name = "serial"
path = "tests/serial.rs"
